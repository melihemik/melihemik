name: README build

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'dark_mode.png'
            - 'light_mode.png'
            - 'dark_mode.svg'
            - 'light_mode.svg'
            - 'cache/**'
    schedule:
        - cron: "0 4 * * *"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: cache/requirements.txt

            - name: Install dependencies
              run: |
                  sudo apt-get update && sudo apt-get install -y librsvg2-bin
                  python -m pip install -r cache/requirements.txt

            - name: Update README stats
              env:
                  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
                  USER_NAME: melihemik
              run: python today.py

            - name: Render PNGs
              run: python convert.py

            - name: Commit and push changes
              run: |-
                  git config --global user.email "melihemik@noirlang.tr"
                  git config --global user.name "melihemik[bot]"
                  git add dark_mode.svg light_mode.svg dark_mode.png light_mode.png cache/
                  if ! git diff --staged --quiet; then
                      git commit -m "bot: auto update README stats - $(date +'%Y-%m-%d') [skip ci]"
                      git pull --rebase origin main
                      git push origin main
                  fi
